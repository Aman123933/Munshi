services:
  - type: web
    name: munshi
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_MODE
        value: gemini
      - key: PYTHON_VERSION
        value: 3.11.9
